<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LangChain RAG 智能问答助手</title>
  <style>
    :root {
      --brand-1: #5b7cfa;
      --brand-2: #8b5cf6;
      --bg: #eef1fb;
      --card: #ffffff;
      --text: #1f2430;
      --text-2: #6b7280;
      --border: #e5e7eb;
      --user-bubble: linear-gradient(135deg, #5b7cfa, #8b5cf6);
      --bot-bubble: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(91,124,250,.18), transparent 60%),
        radial-gradient(1000px 500px at 100% 0%, rgba(139,92,246,.16), transparent 55%),
        var(--bg);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .app {
      width: 780px; max-width: 100%; height: 92vh; max-height: 860px;
      background: var(--card);
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(30, 40, 90, .16);
      display: flex; flex-direction: column; overflow: hidden;
    }
    /* ---- 顶部标题栏 ---- */
    .header {
      padding: 16px 22px;
      background: linear-gradient(120deg, #5b7cfa, #8b5cf6 65%, #a855f7);
      color: #fff;
      display: flex; align-items: center; gap: 14px;
    }
    .header .logo {
      width: 44px; height: 44px; flex: none;
      background: rgba(255,255,255,.22);
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .header .titles h1 { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
    .header .titles p { font-size: 12px; opacity: .9; margin-top: 2px; }
    .phone-box { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .phone-box input {
      border: none; border-radius: 9px; padding: 7px 10px; width: 132px;
      font-size: 13px; color: var(--text); outline: none;
      background: rgba(255,255,255,.94);
    }
    /* ---- 聊天区 ---- */
    .chat {
      flex: 1; padding: 22px 22px 8px; overflow-y: auto;
      background: linear-gradient(#fafbff, #f5f6fb);
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar { width: 8px; }
    .chat::-webkit-scrollbar-thumb { background: #d3d6e0; border-radius: 8px; }
    .msg { margin-bottom: 18px; display: flex; align-items: flex-end; gap: 10px; animation: rise .28s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .avatar {
      width: 34px; height: 34px; flex: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; color: #fff;
    }
    .msg.bot .avatar { background: linear-gradient(135deg, #5b7cfa, #8b5cf6); box-shadow: 0 4px 10px rgba(91,124,250,.35); }
    .msg.user { flex-direction: row-reverse; }
    .msg.user .avatar { background: linear-gradient(135deg, #64748b, #475569); box-shadow: 0 4px 10px rgba(71,85,105,.3); }
    .bubble-wrap { max-width: 76%; display: flex; flex-direction: column; }
    .msg.user .bubble-wrap { align-items: flex-end; }
    .bubble {
      padding: 11px 15px; border-radius: 16px; line-height: 1.65; font-size: 15px;
      word-break: break-word; white-space: pre-wrap;
    }
    .msg.bot .bubble {
      background: var(--bot-bubble); color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: 0 3px 12px rgba(30,40,90,.06);
    }
    .msg.user .bubble {
      background: var(--user-bubble); color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 5px 14px rgba(91,124,250,.28);
    }
    .meta { font-size: 11px; color: #9aa0ae; margin-top: 4px; padding: 0 2px; }
    /* 打字指示 */
    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 6px 4px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: #a9b0c4;
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
    /* ---- 快捷提问标签 ---- */
    .suggests {
      padding: 6px 16px 4px; display: flex; gap: 8px; overflow-x: auto; flex-wrap: nowrap;
      background: #fff;
    }
    .suggests::-webkit-scrollbar { display: none; }
    .suggests .chip {
      flex: none; font-size: 12.5px; color: #5b7cfa; cursor: pointer;
      background: #eef1fe; border: 1px solid #dfe5fd; border-radius: 999px;
      padding: 6px 12px; white-space: nowrap; transition: .18s;
    }
    .suggests .chip:hover { background: #dfe6ff; border-color: #c4d0fb; transform: translateY(-1px); }
    /* ---- 输入区 ---- */
    .input-area { padding: 12px 16px 16px; border-top: 1px solid #eef0f5; background: #fff; display: flex; gap: 10px; align-items: flex-end; }
    .input-area textarea {
      flex: 1; resize: none; height: 48px; min-height: 48px; max-height: 140px;
      padding: 13px 16px; border: 1px solid #d8dce6; border-radius: 14px;
      font-size: 15px; font-family: inherit; color: var(--text); outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-area textarea:focus { border-color: #5b7cfa; box-shadow: 0 0 0 3px rgba(91,124,250,.14); }
    .input-area button {
      flex: none; height: 48px; padding: 0 24px; border: none; border-radius: 14px;
      background: var(--user-bubble); color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: transform .15s, box-shadow .2s, opacity .2s;
      box-shadow: 0 6px 16px rgba(91,124,250,.3);
    }
    .input-area button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(91,124,250,.4); }
    .input-area button:active { transform: translateY(0); }
    .input-area button:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; transform: none; }
    .foot-note { text-align: center; font-size: 11px; color: #b6bcc9; padding: 0 16px 12px; background: #fff; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">🤖</div>
      <div class="titles">
        <h1>LangChain RAG 智能问答助手</h1>
        <p>金融 · 医疗 · 法律 领域知识问答</p>
      </div>
      <div class="phone-box">
        手机号<input id="phone" value="19836701050" />
      </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="suggests" id="suggests">
      <div class="chip" data-q="什么是CPI？它对债券价格有什么影响？">📈 CPI 与债券</div>
      <div class="chip" data-q="流感应该如何预防？">🩺 流感预防</div>
      <div class="chip" data-q="签订劳动合同需要注意哪些条款？">⚖️ 劳动合同</div>
      <div class="chip" data-q="诉讼时效是多久？">⚖️ 诉讼时效</div>
      <div class="chip" data-q="存款保险的保障上限是多少？">🏦 存款保险</div>
    </div>

    <div class="input-area">
      <textarea id="input" placeholder="输入你的问题，回车发送，Shift+回车换行 ..."></textarea>
      <button id="send">发送</button>
    </div>
    <div class="foot-note">本助手基于本地知识库检索（RAG）+ LangChain 构建</div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const phoneEl = document.getElementById('phone');

    function now() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function addBubble(text, who) {
      const row = document.createElement('div');
      row.className = 'msg ' + who;

      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = who === 'user' ? '我' : '🤖';

      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = text;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = now();
      wrap.appendChild(b);
      wrap.appendChild(meta);

      row.appendChild(av);
      row.appendChild(wrap);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return b;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'msg bot typing-row';
      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = '🤖';
      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';
      const b = document.createElement('div');
      b.className = 'bubble';
      b.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
      wrap.appendChild(b);
      row.appendChild(av);
      row.appendChild(wrap);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }

    async function send(text) {
      const phone = phoneEl.value.trim();
      if (!text) return;
      if (!phone) { alert('请先填写手机号'); return; }

      addBubble(text, 'user');
      input.value = '';
      input.style.height = '48px';
      sendBtn.disabled = true;
      const typingRow = showTyping();

      try {
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone_number: phone, query: text })
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '', full = '';

        // 把打字指示改为真实回复气泡
        const botBubble = document.createElement('div');
        botBubble.className = 'bubble';
        const botWrap = typingRow.querySelector('.bubble-wrap');
        botWrap.innerHTML = '';
        botWrap.appendChild(botBubble);

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const obj = JSON.parse(line);
            if (obj.delta) { full += obj.delta; botBubble.textContent = full; }
            else if (obj.error) { botBubble.textContent = '出错：' + obj.error; }
            chat.scrollTop = chat.scrollHeight;
          }
        }
        if (!full) botBubble.textContent = '(无回复)';
        // 追加时间戳
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = now();
        botWrap.appendChild(meta);
      } catch (e) {
        typingRow.remove();
        addBubble('请求失败：' + e.message, 'bot');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', () => send(input.value.trim()));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value.trim()); }
      if (e.key === 'Enter' && !e.shiftKey) {
        input.style.height = 'auto';
        input.style.height = Math.min(140, input.scrollHeight) + 'px';
      }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(140, input.scrollHeight) + 'px';
    });

    // 快捷提问标签
    document.querySelectorAll('#suggests .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        input.value = chip.dataset.q;
        input.style.height = 'auto';
        input.style.height = Math.min(140, input.scrollHeight) + 'px';
        send(input.value.trim());
      });
    });
  </script>
</body>
</html>
